function spark(x,y,n=40){
  if(reduce)return;
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.1,s=2+Math.random()*4.5;
    P.push({x,y,px:x,py:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1})}
}
(function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  P=P.filter(p=>p.l>0);cx.lineCap="round";
  for(const p of P){p.px=p.x;p.py=p.y;p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy=p.vy*.96+.03;p.l-=.011;
    cx.strokeStyle=`rgba(255,255,255,${Math.max(p.l,0)})`;cx.lineWidth=1;cx.beginPath();cx.moveTo(p.px,p.py);cx.lineTo(p.x,p.y);cx.stroke()}
  requestAnimationFrame(loop);
})();

/* ===== 出席確認：名簿（2026年度 桐榮祭実行委員会名簿・計27名）と照合エンジン ===== */
const ROSTER=[

["m18","広報","","信坂","花","のぶさか","はな"],
["m19","広報","","荒井","史名","あらい","ふみな"],
["m20","広報","","山中","美葵","やまなか","あおい"],
["m21","渉外","渉外長","大久保","千智","おおくぼ","ちさと"],
["m22","渉外","","飯島","奈々恵","いいじま","ななえ"],
["m23","渉外","","島崎","芽香","しまざき","めいか"],
["m24","渉外","","神作","陽菜","かんさく","ひな"],
["m25","会計","","伏見","新生","ふしみ","にいお"],
["m26","会計","","渡邉","晴惺","わたなべ","はるせ"],
["m27","会計","","有賀","大輝","ありが","だいき"]
].map(([id,g,role,f,gv,fk,gk])=>({id,g,role,name:f+" "+gv,kana:fk+" "+gk,_k:[f,gv,fk,gk]}));
const VARI={"邉":"辺","邊":"辺","髙":"高","澤":"沢","條":"条","榮":"栄","齋":"斉","齊":"斉","德":"徳","國":"国","濱":"浜","嶋":"島"};
const norm=s=>String(s).normalize("NFKC").normalize("NFD").replace(/[\u3099\u309a]/g,"").normalize("NFC").toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[^\u3041-\u309f\u30fca-z0-9\u3400-\u9fff]/g,"").replace(/[邉邊髙澤條榮齋齊德國濱嶋]/g,c=>VARI[c]);
const HON=/(さん|くん|ちゃん|様|さま|氏|君|先輩|せんぱい)$/;
ROSTER.forEach(m=>{const[f,g,fk,gk]=m._k.map(norm);m.keys=[f+g,g+f,fk+gk,gk+fk,f,g,fk,gk];delete m._k});
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function sim(x,k){
  if(x===k)return 1;
  const a=x.length,b=k.length;
  if(Math.min(a,b)>=2){if(k.startsWith(x))return .9;if(x.includes(k))return .88;if(k.includes(x))return .8}
  if(Math.max(a,b)>=2)return 1-lev(x,k)/Math.max(a,b);
  return 0;
}
/* 入力名 → 名簿の人（フルネーム・名字だけ・名前だけ・ひらがな/カタカナ・旧字体・敬称付き・軽い打ち間違いでも照合） */
function matchMember(raw){
  const x0=norm(raw);if(!x0)return{m:null,cands:[]};
  const x=x0.replace(HON,"")||x0;
  const sc=ROSTER.map(m=>[Math.max(...m.keys.map(k=>sim(x,k))),m]).sort((a,b)=>b[0]-a[0]);
  const s1=sc[0][0];
  if(s1<.5)return{m:null,cands:[]};
  if(sc[1][0]>=s1-.03)return{m:null,cands:sc.filter(t=>t[0]>=s1-.03).map(t=>t[1].id)};
  return{m:sc[0][1],cands:[]};
}

async function record(nm){
  try{
    if(!window.claude||!claude.use)return;
    const db=await claude.use("db");if(!db)return;
    const r=matchMember(nm);
    if(r.m)await db.doc("attendance/"+r.m.id).set({name:nm,at:Date.now(),auto:true});
    else await db.collection("entries").add({name:nm,at:Date.now(),cands:r.cands});
  }catch(e){}
}
$("name").addEventListener("input",()=>{$("nerr").textContent=""});

/* gate -> site */
$("join").onclick=e=>{
  const nm=$("name").value.trim(),r=e.currentTarget.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  if(!nm){$("nerr").textContent="お名前を入力してください。";$("name").focus();return}
  record(nm);
  $("hi").textContent=nm?`ようこそ、${nm}さん`:"ようこそ";
  $("join").disabled=true;$("gate").classList.add("tear");
  spark(x,y,72);setTimeout(()=>spark(x-60,y-40,40),180);
  {const w=document.querySelector(".t-stub").getBoundingClientRect();for(let i=0;i<=8;i++)setTimeout(()=>spark(w.left+w.width*i/8,w.top,12),450+i*70)}
  setTimeout(()=>{
    document.body.classList.add("go");
    const g=$("gate"),a=g.animate([{opacity:1},{opacity:0}],{duration:reduce?1:1300,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"});
    a.onfinish=()=>{g.remove();document.body.classList.remove("lock");scrollTo(0,0)};
  },reduce?0:1300);
};

/* ===== 編集機能（オーナー／編集権限のある人だけに表示） ===== */
const HEAD='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>桐榮祭実行委員 打ち上げ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">';
function build(c){
  const j=JSON.stringify(c).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="ja"><head>'+HEAD+'<style id="css">'+$("css").textContent+'</style></head><body class="lock"><template id="tpl">'+$("tpl").innerHTML+'</template><script type="application/json" id="cfg">'+j+'<\/script><script id="app">'+$("app").textContent+'<\/script></body></html>';
}
function h(t,a={},...c){const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k.startsWith("on"))e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x));return e}
function field(lab,val,fn,o={}){const i=h(o.area?"textarea":"input",o.area?{rows:2}:{type:o.type||"text"});i.value=val;i.oninput=()=>fn(i.value);return h("div",{},h("label",{},lab),i)}
async function setupEditor(art){
  const btn=h("button",{id:"edbtn"},"編集");document.body.append(btn);
  btn.onclick=()=>{
    let d=JSON.parse(JSON.stringify(cfg));if(typeof d.mega!=="string")d.mega="Wrap Party";
    const ov=h("div",{id:"ed"});document.body.append(ov);
    const st=h("span",{class:"st"});
    const att={};let ents=[],dbr=null,box=null,note="読み込み中…";const unsubs=[];
    function renderAtt(){
      if(!box||!box.isConnected)return;
      box.innerHTML="";
      const n=ROSTER.filter(m=>att[m.id]).length;
      box.append(h("div",{class:"attn"},h("b",{},String(n)),` / ${ROSTER.length}名 出席`));
      if(note)box.append(h("div",{class:"attm"},note));
      const flip=m=>{if(!dbr)return;const r=dbr.doc("attendance/"+m.id);(att[m.id]?r.delete():r.set({name:m.name,at:Date.now(),manual:true})).catch(()=>{note="更新できませんでした。";renderAtt()})};
      [...new Set(ROSTER.map(m=>m.g))].forEach(g=>{
        const L=ROSTER.filter(m=>m.g===g);
        box.append(h("div",{class:"agh"},h("span",{},g),h("span",{},`${L.filter(m=>att[m.id]).length} / ${L.length}`)));
        L.forEach(m=>{
          const a=att[m.id];
          box.append(h("div",{class:"arow"+(a?" on":""),role:"button",tabindex:"0",onclick:()=>flip(m),onkeydown:ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();flip(m)}}},
            h("i",{},a?"✓":""),
            h("div",{class:"nm"},m.name,h("small",{},m.kana+(m.role?"　"+m.role:"")+(a&&a.name&&a.auto?"　入力：「"+a.name+"」":a&&a.manual?"　手動":""))
          )));
        });
      });
      if(ents.length){
        box.append(h("div",{class:"agh"},h("span",{},"名簿に一致しなかった入力"),h("span",{},String(ents.length))));
        ents.forEach(en=>{
          const rest=ROSTER.filter(m=>!att[m.id]).sort((a,b)=>((en.cands||[]).includes(b.id)?1:0)-((en.cands||[]).includes(a.id)?1:0));
          const sel=h("select",{},h("option",{value:""},"出席者として割り当てる…"),rest.map(m=>h("option",{value:m.id},m.name)));
          sel.onchange=()=>{if(!sel.value||!dbr)return;const m=ROSTER.find(x=>x.id===sel.value);
            dbr.doc("attendance/"+m.id).set({name:en.name,at:Date.now(),manual:true}).then(()=>dbr.doc("entries/"+en.id).delete()).catch(()=>{})};
          box.append(h("div",{class:"ent"},h("div",{},"「"+en.name+"」",(en.cands&&en.cands.length)?h("small",{style:"color:#8a8a8a"},"（複数の候補に近い入力）"):""),sel,
            h("div",{class:"tools"},h("button",{onclick:()=>{dbr&&dbr.doc("entries/"+en.id).delete().catch(()=>{})}},"消す"))));
        });
      }
    }
    (async()=>{
      try{
        dbr=window.claude&&claude.use?await claude.use("db"):null;
        if(!dbr){note="出席データを読み込めません（サインインが必要です）。";renderAtt();return}
        note="";
        unsubs.push(dbr.collection("attendance").onSnapshot(s=>{Object.keys(att).forEach(k=>delete att[k]);s.docs.forEach(x=>{att[x.id]=x.data()});renderAtt()},()=>{note="出席データを読み込めません。";renderAtt()}));
        unsubs.push(dbr.collection("entries").onSnapshot(s=>{ents=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>a.at-b.at);renderAtt()},()=>{}));
      }catch(e){note="出席データを読み込めません。";renderAtt()}
    })();
    function draw(){
      ov.innerHTML="";
      const w=h("div",{class:"wrap"});
      w.append(h("h3",{},"内容を編集"));
      w.append(h("h4",{},"出席確認"));
      box=h("div",{});w.append(box);renderAtt();
      w.append(h("h4",{},"トップの文字（円の中）"));w.append(field("表示する文字（短めがおすすめ）",d.mega,v=>d.mega=v));
      w.append(h("h4",{},"日時"));
      w.append(h("div",{class:"two"},field("開始（日付と時刻）",d.date,v=>d.date=v,{type:"datetime-local"}),field("終了時刻",d.end,v=>d.end=v,{type:"time"})));
      w.append(h("h4",{},"開催概要（日時以外）"));
      d.info.forEach((r,i)=>w.append(h("div",{class:"card"},
        h("div",{class:"two"},field("項目",r[0],v=>r[0]=v),field("内容",r[1],v=>r[1]=v)),
        h("div",{class:"tools"},h("button",{onclick:()=>{d.info.splice(i,1);draw()}},"削除")))));
      w.append(h("div",{class:"tools"},h("button",{onclick:()=>{d.info.push(["",""]);draw()}},"＋ 項目を追加")));
      w.append(h("h4",{},"当日の流れ"));
      d.timeline.forEach((r,i)=>w.append(h("div",{class:"card"},
        h("div",{class:"two"},field("時刻",r[0],v=>r[0]=v),field("タイトル",r[1],v=>r[1]=v)),
        field("説明",r[2],v=>r[2]=v,{area:1}),
        h("div",{class:"tools"},
          h("button",{onclick:()=>{if(i>0){[d.timeline[i-1],d.timeline[i]]=[d.timeline[i],d.timeline[i-1]];draw()}}},"↑"),
          h("button",{onclick:()=>{if(i<d.timeline.length-1){[d.timeline[i+1],d.timeline[i]]=[d.timeline[i],d.timeline[i+1]];draw()}}},"↓"),
          h("button",{onclick:()=>{d.timeline.splice(i,1);draw()}},"削除")))));
      w.append(h("div",{class:"tools"},h("button",{onclick:()=>{d.timeline.push(["","",""]);draw()}},"＋ 予定を追加")));
      const save=h("button",{class:"pri"},"保存して公開");
      save.onclick=async()=>{
        if(!/^\d+-\d+-\d+T\d+:\d+$/.test(d.date)){st.textContent="開始の日付と時刻を入力してください。";return}
        save.disabled=true;st.textContent="保存しています…";
        try{await art.publish(build(d))}
        catch(e){save.disabled=false;st.textContent=e&&(e.code==="not_writer"||e.code==="not_granted")?"この画面からは保存できません（編集権限がありません）。":e&&e.code==="conflict"?"他の更新と重なりました。ページが最新に切り替わります。":"保存できませんでした。時間をおいてもう一度お試しください。"}
      };
      w.append(h("div",{class:"bar"},save,h("button",{onclick:()=>{unsubs.forEach(u=>{try{u()}catch(e){}});ov.remove()}},"閉じる"),st));
      ov.append(w);
    }
    draw();
  };
}
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const K="kiri_edit_device";
    try{if(location.hash==="#edit")localStorage.setItem(K,"1");else if(location.hash==="#noedit")localStorage.removeItem(K)}catch(e){}
    let ok=false;try{ok=localStorage.getItem(K)==="1"}catch(e){}
    if(!ok)return;
    const art=await claude.use("artifact");
    setupEditor(art||{publish:async()=>{const e=new Error("x");e.code="not_granted";throw e}});
  }catch(e){}
})();
